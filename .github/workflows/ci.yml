name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  portable-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-key-for-ci-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Disable husky
        run: npm pkg delete scripts.prepare
      - name: Install dependencies
        run: npm ci
      - name: Assertion guard
        run: npm run test:assertions
      - name: Mock guard
        run: npm run test:mock-guard
      - name: Locale plugin and CLI regressions
        run: npx vitest run --config vitest.config.ci.ts --pool=forks --maxWorkers=1 scripts/i18n/compact-locales.test.ts scripts/check-test-guards.test.ts src/i18n/check-i18n.test.ts scripts/icons/icons.test.ts

  # Base efímera desde migraciones + cuatro seeds locales; no usa secretos remotos.
  # Las pruebas HTTP de Edge Functions siguen siendo una comprobación local aparte.
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh local seeds and SQL security
        run: python scripts/test-local-db.py

  # ── Supabase local real (supabase start) en el runner ───────────────────
  # Mismo stack que el PC del dueño: migraciones + seeds + Edge Functions del
  # checkout (scripts/ci/local-stack.sh). Las imágenes de Docker se bajan de
  # public.ecr.aws en cada ejecución (~1 min): guardarlas en la caché de
  # Actions (varios GB con docker save/load) tarda más que bajarlas.
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.120.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start local Supabase (migrations, seeds, functions)
        run: scripts/ci/local-stack.sh start
      # Sin node_modules en este job: Deno usa su propia caché para los npm: de los tests
      - name: Edge Function tests (Deno, real HTTP against the local stack)
        run: deno test --node-modules-dir=none --allow-net --allow-env --allow-read --env-file=.env.local supabase/functions/tests/
      - name: Backup while the app writes + restore check with an orphan row (bash)
        run: |
          db() { docker exec -i supabase_db_harvestpro-nz psql -X -q -At -v ON_ERROR_STOP=1 -U supabase_admin -d postgres "$@"; }
          # Una fila huérfana (sesión borrada), como las que deja GoTrue: la comprobación avisa y no falla
          db -c "SET session_replication_role = replica; INSERT INTO auth.mfa_amr_claims (id, session_id, created_at, updated_at, authentication_method) VALUES (gen_random_uuid(), gen_random_uuid(), now(), now(), 'password')"
          # Escrituras mientras se hace la copia: los recuentos van en la instantánea del dump
          ( for i in $(seq 1 150); do db -c "INSERT INTO auth.audit_log_entries (id, payload, created_at) VALUES (gen_random_uuid(), '{}', now())"; done ) &
          writer=$!
          dir="$(BACKUP_DIR="$RUNNER_TEMP/backups-sh" KEEP=2 scripts/backup-local.sh)"
          wait "$writer"
          echo "BACKUP_SH=$dir" >> "$GITHUB_ENV"
          test -s "$dir/orphans.tsv"
          scripts/restore-local.sh "$dir" 2>&1 | tee "$RUNNER_TEMP/check.log"
          test "${PIPESTATUS[0]}" = 0
          grep -q 'auth.mfa_amr_claims: 1 row(s)' "$RUNNER_TEMP/check.log"
      - name: A backup that lost most of its rows does not rotate the old ones (bash)
        run: |
          prev="$RUNNER_TEMP/backups-sh/harvestpro_2000-01-01_000000"
          cp -r "$BACKUP_SH" "$prev"
          awk -F'\t' -v OFS='\t' '$1 == "public.pickers" { $2 = $2 * 10 } { print }' "$BACKUP_SH/row-counts.tsv" > "$prev/row-counts.tsv"
          # Que la copia "anterior" sea la última por fecha
          mv "$prev" "$RUNNER_TEMP/backups-sh/harvestpro_2999-01-01_000000"
          before="$(ls "$RUNNER_TEMP/backups-sh" | grep -c '^harvestpro_')"
          code=0; BACKUP_DIR="$RUNNER_TEMP/backups-sh" KEEP=1 scripts/backup-local.sh || code=$?
          test "$code" = 2
          ls "$RUNNER_TEMP/backups-sh" | grep -q '\.suspect$'
          test "$(ls "$RUNNER_TEMP/backups-sh" | grep -c '^harvestpro_.*[0-9]$')" = "$((before))"
          rm -rf "$RUNNER_TEMP/backups-sh/harvestpro_2999-01-01_000000"
      - name: Backup + restore check (PowerShell, the owner's Windows script)
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          # Ruta relativa a propósito (se resuelve contra la carpeta actual)
          $dir = (& "$env:GITHUB_WORKSPACE/scripts/backup-local.ps1" -BackupDir 'backups-ps' -MirrorDir 'backups-ps-mirror' -Keep 2) | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $dir -or -not (Test-Path (Join-Path $dir 'database.dump'))) { throw 'backup-local.ps1 returned no folder' }
          if (-not (Test-Path (Join-Path 'backups-ps-mirror' (Split-Path -Leaf $dir)))) { throw 'no second copy' }
          "BACKUP_PS=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "$env:GITHUB_WORKSPACE/scripts/restore-local.ps1" -Backup (Join-Path 'backups-ps' (Split-Path -Leaf $dir))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Disaster recovery into an empty stack (bash, then PowerShell)
        env:
          SUPABASE_BIN: supabase
        run: |
          login() {
            . ./.env.local
            curl -sf -o /dev/null -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
              -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
              -d '{"email":"lead@harvestpro.nz","password":"111111"}' \
              || { echo "::error::seeded account cannot sign in after the $1 restore"; exit 1; }
            echo "seeded account signs in after the $1 restore"
          }
          scripts/ci/local-stack.sh reset
          scripts/restore-local.sh "$BACKUP_SH" --fresh-stack
          login bash
          scripts/ci/local-stack.sh reset
          pwsh -NoProfile -File scripts/restore-local.ps1 -Backup "$BACKUP_PS" -FreshStack
          login PowerShell
      - name: Disaster recovery of a backup from an older schema (before 20261024030000)
        env:
          SUPABASE_BIN: supabase
        run: |
          db() { docker exec -i supabase_db_harvestpro-nz psql -X -q -At -v ON_ERROR_STOP=1 -U supabase_admin -d postgres "$@"; }
          old="$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/_.*//' | sort | awk '$1 < "20261024030000"' | tail -1)"
          echo "Old schema: $old"
          scripts/ci/local-stack.sh reset "$old"
          scripts/ci/local-stack.sh seed
          test "$(db -c "select to_regclass('public.wage_rates') is not null")" = t
          dir="$(BACKUP_DIR="$RUNNER_TEMP/backups-old" scripts/backup-local.sh)"
          scripts/ci/local-stack.sh reset
          scripts/restore-local.sh "$dir" --fresh-stack
          # Esquema al día (las tablas muertas ya no están) y los datos de la copia dentro
          test "$(db -c "select to_regclass('public.wage_rates') is null and to_regclass('public.messages') is null")" = t
          test "$(db -c "select max(version) from supabase_migrations.schema_migrations")" = "$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/_.*//' | sort | tail -1)"
          test "$(db -c 'select count(*) from public.pickers')" = "$(awk -F'\t' '$1 == "public.pickers" { print $2 }' "$dir/row-counts.tsv")"
      - name: Edge runtime and database logs
        if: failure()
        run: |
          docker logs --tail 300 supabase_edge_runtime_harvestpro-nz || true
          docker logs --tail 200 supabase_db_harvestpro-nz || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_CLI_VERSION: 2.120.0
      MOBILE_SCREENS_DIR: ${{ github.workspace }}/test-results-mobile/screens
      MOBILE_FINDINGS_FILE: ${{ github.workspace }}/test-results-mobile/findings.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Disable husky
        run: npm pkg delete scripts.prepare
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase (migrations, seeds, functions)
        run: scripts/ci/local-stack.sh start
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # vite build + vite preview en :3000 (webServer de playwright.mobile.config.ts)
      - name: Smoke - every role signs in, one key action per role
        run: npm run test:e2e:smoke
      # Spec «empresa desde cero» (encargo A): base recién migrada, sin seeds
      # Spec «empresa desde cero» (encargo A, e2e/fresh-company.spec.ts). Mientras el spec no
      # esté en la rama se avisa y se salta; si el spec está y falta el script, falla.
      # Configuración de desarrollo: 2FA del servidor apagado y build con VITE_MFA_ENFORCE=false
      - name: Company from zero (fresh database)
        env:
          VITE_MFA_ENFORCE: 'false'
        run: |
          has_script="$(node -e "process.stdout.write(require('./package.json').scripts['test:e2e:fresh'] ? '1' : '')")"
          if [ -z "$has_script" ]; then
            if [ -f e2e/fresh-company.spec.ts ]; then
              echo '::error::e2e/fresh-company.spec.ts exists but package.json has no test:e2e:fresh'; exit 1
            fi
            echo '::notice::company-from-zero spec not on this branch yet (encargo A): skipped'
            exit 0
          fi
          scripts/ci/local-stack.sh reset
          scripts/ci/local-stack.sh disable-mfa
          npm run test:e2e:fresh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report-mobile/
            playwright-report/
            test-results-mobile/
            test-results/
          retention-days: 7

  android-apk:
    # APK de depuración sin firmar, como artefacto (no se publica en ninguna tienda)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Disable husky
        run: npm pkg delete scripts.prepare
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npx vite build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-key-for-ci-tests-only
      - name: Copy web build into the Android project
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check the APK exists
        run: ls -l android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: harvestpro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Disable husky
        run: npm pkg delete scripts.prepare

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.shard == '1/5'
        run: npm run lint --if-present

      - name: Tests that cannot fail (no assertions / expect(true))
        if: matrix.shard == '1/5'
        run: npm run test:assertions

      - name: vi.mock targets not preloaded by test setup
        if: matrix.shard == '1/5'
        run: npm run test:mock-guard

      - name: Translations (keys in all locales, placeholders, no new hard-coded text)
        if: matrix.shard == '1/5'
        run: npm run i18n:check

      - name: Test (shard ${{ matrix.shard }})
        run: npx vitest run --config vitest.config.ci.ts --shard=${{ matrix.shard }}
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-key-for-ci-tests-only

  perf-budget:
    # Presupuesto de rendimiento móvil: JS/CSS inicial de /login y /runner, librerías
    # prohibidas en la ruta crítica, tamaño de fuentes y precache del SW (~1 min).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Disable husky
        run: npm pkg delete scripts.prepare

      - name: Install dependencies
        run: npm ci

      - name: Icon font contains every icon used in code
        run: npm run icons:check

      - name: Build (vite)
        run: npx vite build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-key-for-ci-tests-only

      - name: Performance budget
        run: npm run perf:budget

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Disable husky
        run: npm pkg delete scripts.prepare

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-key-for-ci-tests-only

      # Sin despliegue automático: el proyecto corre en Supabase local (Docker).
      # Los antiguos deploys a Hetzner (SSH) y Vercel se retiraron el 2026-10-10.

      - name: Notify Telegram Success
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            --data-urlencode "text=✅ <b>${{ github.event.repository.name }}</b> CI passed
          📝 $COMMIT_MESSAGE
          🌿 Branch: ${{ github.ref_name }}"

      - name: Notify Telegram Failure
        if: failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            --data-urlencode "text=❌ <b>${{ github.event.repository.name }}</b> CI FAILED
          🌿 Branch: ${{ github.ref_name }}
          🔗 https://github.com/ibra1927jn/${{ github.event.repository.name }}/actions"
